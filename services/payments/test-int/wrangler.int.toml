name = "payments-integration-test"
main = "entry.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_SLUG = "dachnye-tainy"
VK_APP_ID = "54767366"
PAYMENTS_MODE = "test"
OK_APP_KEY = "INTTESTKEY"
VK_APP_SECRET = "int-vk-secret"
