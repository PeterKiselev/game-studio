name = "dachnye-tainy-payments"
main = "src/index.ts"
compatibility_date = "2026-09-01"
# node:crypto (createHash) нужен именно ради md5 — Web Crypto (crypto.subtle)
# его не поддерживает, MD5 там нет в списке допустимых алгоритмов.
compatibility_flags = ["nodejs_compat"]

# VK_APP_SECRET — секрет из dev.vk.ru → Приложение → Платежи → Подключение,
# заводится командой `npx wrangler secret put VK_APP_SECRET`, не хранится
# в этом файле и не коммитится никуда.

# --- Учёт покупок и Одноклассники ------------------------------------------
# НЕ развёрнуто и не включено. Пока блоков ниже нет, ВК работает как раньше
# (подтверждение без учёта), а /ok и /restore отвечают «не настроено».
# Включение — только после ревью Codex и по решению владельца:
#   1) раскомментировать [[durable_objects.bindings]] и [[migrations]] ниже;
#   2) [vars]: APP_SLUG, VK_APP_ID, PAYMENTS_MODE ("test" до модерации, "live" после), OK_APP_KEY;
#   3) секрет подписи ОК: `npx wrangler secret put OK_APP_SECRET`
#      (какое поле кабинета — не подтверждено, см. docs/ok-dachnye-tainy-payments-2026-10.md);
#   4) цены в ОКах (`priceOk`) в src/index.ts — называет владелец.
# [vars]
# APP_SLUG = "dachnye-tainy"
# VK_APP_ID = "54767366"
# PAYMENTS_MODE = "test"
# OK_APP_KEY = "<публичный application_key ОК-приложения>"
#
# [[durable_objects.bindings]]
# name = "LEDGER"
# class_name = "LedgerDO"
#
# [[migrations]]
# tag = "v1"
# new_sqlite_classes = ["LedgerDO"]
