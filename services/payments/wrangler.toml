name = "dachnye-tainy-payments"
main = "src/index.ts"
compatibility_date = "2026-09-01"
# node:crypto (createHash) нужен именно ради md5 — Web Crypto (crypto.subtle)
# его не поддерживает, MD5 там нет в списке допустимых алгоритмов.
compatibility_flags = ["nodejs_compat"]

# VK_APP_SECRET — секрет из dev.vk.ru → Приложение → Платежи → Подключение,
# заводится командой `npx wrangler secret put VK_APP_SECRET`, не хранится
# в этом файле и не коммитится никуда.

# --- Учёт покупок и Одноклассники ------------------------------------------
# Основной (боевой) Worker выше — без журнала: ВК работает как раньше, /ok и
# /restore отвечают «не настроено». Рабочий режим платежей ОК заблокирован в
# коде до подтверждения признака режима в уведомлениях ОК.
#
# Изолированный ТЕСТОВЫЙ сервер — отдельный Worker с другим именем и адресом,
# только PAYMENTS_MODE = "test". НЕ развёрнут. Развёртывание — только после
# ревью Codex и по решению владельца: `npx wrangler deploy --env oktest`
# (секреты: `npx wrangler secret put OK_APP_SECRET --env oktest`, то же для
# VK_APP_SECRET). Цены в ОКах (`priceOk`) называет владелец.
[env.oktest]
name = "dachnye-tainy-payments-oktest"

[env.oktest.vars]
APP_SLUG = "dachnye-tainy"
VK_APP_ID = "54767366"
PAYMENTS_MODE = "test"
# OK_APP_KEY = "<публичный application_key ОК-приложения — пока неизвестен>"

[[env.oktest.durable_objects.bindings]]
name = "LEDGER"
class_name = "LedgerDO"

[[env.oktest.migrations]]
tag = "v1"
new_sqlite_classes = ["LedgerDO"]
