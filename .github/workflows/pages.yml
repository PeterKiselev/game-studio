name: Deploy to GitHub Pages

# Один сайт отдаёт сборки нескольких игр сразу:
#   /                     — гомоку, веб-версия (для itch.io и прямых ссылок)
#   /vk/                  — гомоку под VK Mini Apps
#   /yandex/              — гомоку под Яндекс Игры
#   /dachnye-tainy/       — «Дачные тайны», веб-версия для плейтеста
#   /dachnye-tainy/vk/    — «Дачные тайны» под VK Mini Apps (тот же адрес
#                           вписывается в форму «Размещение» в dev.vk.ru)
# Гомоку занимает корень, потому что его адрес уже вписан в формы VK
# и Яндекса — переносить рискованно без пользы. Следующие игры получают
# свой путь по имени, а не делят корень с первой.
# Адрес постоянный, менять его в консолях площадок больше не придётся.

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Правила игр обязаны быть зелёными до любого деплоя
      - run: npm test

      - run: npm run typecheck

      - run: npm run build:all

      - run: npm run build -w @studio/dachnye-tainy
      - run: npm run build:dachnye-tainy:vk

      - name: Собрать сайт из сборок обеих игр
        run: |
          mkdir -p site/vk site/yandex site/dachnye-tainy site/dachnye-tainy/vk
          cp -r games/gomoku/dist/web/. site/
          cp -r games/gomoku/dist/vk/. site/vk/
          cp -r games/gomoku/dist/yandex/. site/yandex/
          cp -r games/dachnye-tainy/dist/web/. site/dachnye-tainy/
          cp -r games/dachnye-tainy/dist/vk/. site/dachnye-tainy/vk/
          # Правовые документы, иконки и скриншоты — площадки требуют
          # постоянные адреса на них, поэтому едут вместе с игрой
          cp -r static/. site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
