name: Isolated Dachnye page scroll hotfix October 27
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: 44283327114
          github-token: ${{ github.token }}
          path: previous-artifact
      - name: Restore exact currently published site
        run: |
          mkdir site
          tar -xf previous-artifact/artifact.tar -C site
          node tools/verify-production-baseline.mjs site
      - uses: actions/upload-artifact@v4
        with:
          name: previous-production-site
          path: site
          include-hidden-files: true
          retention-days: 30
      - name: Overlay explicit game release folders
        run: |
          cp -a release-web/. site/dachnye-tainy/
          cp -a release-candidate/. site/dachnye-tainy/vk/
          mkdir -p site/durak
          cp -a release-durak/. site/durak/
          mkdir -p site/checkers site/2048
          cp -a release-checkers/. site/checkers/
          cp -a release-2048/. site/2048/
          mkdir -p site/solitaire
          cp -a release-solitaire/. site/solitaire/
          node tools/verify-production-baseline.mjs site --except=dachnye-tainy/,durak/,checkers/,2048/,solitaire/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 30
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
