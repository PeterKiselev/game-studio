name: Deploy to GitHub Pages

# Один сайт отдаёт все три сборки сразу:
#   /         — веб-версия (для itch.io и прямых ссылок)
#   /vk/      — сборка для VK Mini Apps
#   /yandex/  — сборка для Яндекс Игр
# Адрес постоянный, менять его в консолях площадок больше не придётся.

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Правила игр обязаны быть зелёными до любого деплоя
      - run: npm test

      - run: npm run typecheck

      - run: npm run build:all

      - name: Собрать сайт из трёх сборок
        run: |
          mkdir -p site/vk site/yandex
          cp -r games/gomoku/dist/web/. site/
          cp -r games/gomoku/dist/vk/. site/vk/
          cp -r games/gomoku/dist/yandex/. site/yandex/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
