name: Isolated Dachnye Tainy OK release
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: f23eb97f49b8c85720e39b2717553236decf9fd7
          path: baseline
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            baseline/package-lock.json
            candidate/package-lock.json
      - name: Reconstruct last successful published site
        working-directory: baseline
        run: |
          npm ci
          npm run build:all
          npm run build -w @studio/dachnye-tainy
          npm run build:dachnye-tainy:vk
          npm run build:pograniche:web
          npm run build:sudoku:web
          npm run build:sudoku:vk
      - name: Assemble unchanged baseline
        run: |
          mkdir -p site/vk site/yandex site/dachnye-tainy/vk site/pograniche site/sudoku/vk
          cp -a baseline/games/gomoku/dist/web/. site/
          cp -a baseline/games/gomoku/dist/vk/. site/vk/
          cp -a baseline/games/gomoku/dist/yandex/. site/yandex/
          cp -a baseline/games/dachnye-tainy/dist/web/. site/dachnye-tainy/
          cp -a baseline/games/dachnye-tainy/dist/vk/. site/dachnye-tainy/vk/
          cp -a baseline/games/pograniche/dist/web/. site/pograniche/
          cp -a baseline/games/sudoku/dist/web/. site/sudoku/
          cp -a baseline/games/sudoku/dist/vk/. site/sudoku/vk/
          cp -a baseline/static/. site/
      - name: Verify baseline against public production
        run: node candidate/tools/verify-production-baseline.mjs site
      - uses: actions/upload-artifact@v4
        with:
          name: previous-production-site
          path: site
          include-hidden-files: true
          retention-days: 30
      - name: Build and test release candidate
        working-directory: candidate
        run: |
          npm ci
          npm test
          npm run typecheck
          node node_modules/vitest/vitest.mjs run services/payments/test
          node tools/build-ok-candidate.mjs
          npx playwright install --with-deps chromium
          node tools/playtest-ok-candidate.cjs
      - name: Replace only Dachnye Tainy VK and OK client
        run: |
          cp -a candidate/games/dachnye-tainy/dist/ok-candidate/. site/dachnye-tainy/vk/
          node candidate/tools/verify-production-baseline.mjs site --except=dachnye-tainy/vk/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 30
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
