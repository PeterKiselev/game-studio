name: Isolated Sudoku hint CSS hotfix October 19
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: 38884463083
          github-token: ${{ github.token }}
          path: previous-artifact
      - name: Restore exact currently published site
        run: |
          mkdir site
          tar -xf previous-artifact/artifact.tar -C site
          node tools/verify-production-baseline.mjs site
      - uses: actions/upload-artifact@v4
        with:
          name: previous-production-site
          path: site
          include-hidden-files: true
          retention-days: 30
      - name: Update only Sudoku stylesheet and its two HTML references
        run: |
          node tools/overlay-sudoku-css.mjs site
          node tools/verify-production-baseline.mjs site --except=sudoku-css
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 30
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
